name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Headers, shebang, executable bit
        run: python3 scripts/build-index.py --check
      - name: Shellcheck sh/bash plugins
        run: |
          files=$(python3 scripts/build-index.py --shell)
          if [ -n "$files" ]; then
            echo "$files"
            # shellcheck disable=SC2086
            shellcheck $files
          fi
      - name: Index builds
        run: python3 scripts/build-index.py && python3 -m json.tool index.json > /dev/null
      - name: Python plugins print valid lines
        run: python3 scripts/test-plugins.py

  windows:
    # the real Windows test: every .ps1 under Windows PowerShell, the way zunder runs it,
    # plus the Python plugins. Sample queries only list, nothing connects or stops.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PowerShell and Python plugins print valid lines
        run: python scripts/test-plugins.py
